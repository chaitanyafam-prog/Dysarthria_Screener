{% extends "base.html" %}
{% block title %}Log in · Speech Exercise Tracker{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input type="email" name="email" autocomplete="email" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
